# Continuous integration: every pull request and every push to main runs every test suite (NFR-06).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulator:            # Role 1 – Ying Song
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: simulator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  ingestion:            # Role 2 – Marcelbriaud Wafotchoupe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest paho-mqtt
      - name: Router unit tests
        run: cd broker/router && python -m pytest -v
      - name: Broker security tests (live Mosquitto with mutual TLS)
        run: |
          bash scripts/make_certs.sh
          sudo chgrp -R 1000 broker/certs/mosquitto broker/certs/router broker/certs/simulator && sudo chmod g+s broker/certs/mosquitto broker/certs/router broker/certs/simulator  # containers run as GID 1000
          docker build -t greenops-broker-ci broker
          docker run -d --name mosquitto -p 8883:8883 -v $PWD/broker/certs/mosquitto:/mosquitto/certs:ro greenops-broker-ci
          for i in $(seq 1 30); do docker logs mosquitto 2>&1 | grep -qE "version [0-9.]+ running" && break; sleep 1; done
          docker logs mosquitto; docker ps -a --filter name=mosquitto --format '{{.Status}}'
          python -m pytest -v broker/tests

  functions:            # Role 3 – Shi Wang · Role 4 – Durmusali Unal · Role 5 – Idowu Ayeni
    runs-on: ubuntu-latest
    services:
      cosmos:
        # Pinned: the vnext-preview build published 2026-11-21 (sha256:09dcd04…) fails the storage tests with emulator-internal errors.
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
        ports: ["8081:8081"]
        env: { PROTOCOL: http }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r functions/requirements-dev.txt
      - name: Unit tests and storage contract against the Cosmos DB emulator
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8081/ && break; sleep 3; done
          cd functions && COSMOS_ENDPOINT=http://localhost:8081 python -m pytest -v
      - name: Mail relay tests
        run: cd mail-relay && python -m pytest -v
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Sign-in API tests (including the Node and Python token contract)
        run: cd swa-api && GREENOPS_PYTHON=python node --test
      - name: Scale-test tools
        run: python -m pytest -v load

  dashboard:            # Role 5 – Idowu Ayeni
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ../functions/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: GREENOPS_PYTHON=python npm run test:browser

  infrastructure:       # Role 2 – Marcelbriaud Wafotchoupe
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  end-to-end:           # all roles – the whole system in Docker
    needs: [simulator, ingestion, functions, dashboard, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r e2e/requirements.txt
      - run: python3 scripts/init_local.py
      - run: bash scripts/make_certs.sh
      - run: sudo chgrp -R 1000 broker/certs/mosquitto broker/certs/router broker/certs/simulator && sudo chmod g+s broker/certs/mosquitto broker/certs/router broker/certs/simulator  # containers run as GID 1000
      - run: docker compose -f docker-compose.yml -f e2e/compose.e2e.yml up -d --build
      - run: python -m pytest -v e2e
      - if: failure()
        run: docker compose logs --tail 80
