# Local stand-in for Azure IoT Hub (Role 2 – Marcelbriaud Wafotchoupe)
# Mutual TLS: every client must present a certificate signed by the GreenOps Device CA (FR-03, NFR-03).
persistence true
persistence_location /mosquitto/data/
autosave_interval 10
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
crlfile /mosquitto/certs/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
acl_file /mosquitto/config/acl
