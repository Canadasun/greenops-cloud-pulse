# Serves the built dashboard and forwards API calls (on Azure, Static Web Apps does this).
server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://functions/api/; proxy_set_header Host $host; }
  location /sim/ { return 404; }
}
