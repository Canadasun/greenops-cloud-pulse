# Serves the built dashboard and forwards API calls (on Azure, Static Web Apps does this).
server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /.auth/ { proxy_pass http://local-auth:8060; proxy_set_header Host $host; }
  location = /api/token { proxy_pass http://local-auth:8060; }
  location /api/ { proxy_pass http://functions/api/; proxy_set_header Host $host; }
  location /sim/ { return 404; }
}
