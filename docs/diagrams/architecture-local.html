<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style2.css"></head><body>
<div id="d"><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1400" height="1060"></svg></div>
<script>
// Figure 6 – System and cloud architecture on Microsoft Azure (all roles; Role 2 · Marcelbriaud leads)
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('svg');
function el(tag, a, t) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; svg.appendChild(e); return e; }
el('defs', {}).innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a36"/></marker>`;
const INK = '#1a1a19';
const R = { 1: ['#e3eefb', '#2a78d6'], 2: ['#fbe6ee', '#b3366b'], 3: ['#fde7dd', '#c25a00'], 4: ['#ddf3ea', '#138a5e'], 5: ['#fdf1d6', '#a87200'], x: ['#ffffff', '#6b6b64'], ops: ['#eef0f4', '#55607a'] };
function card(cx, cy, w, h, title, lines, r, dashed = false) {
  el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: R[r][0], stroke: R[r][1], 'stroke-width': 2.4, ...(dashed ? { 'stroke-dasharray': '7 5' } : {}) });
  const n = lines.length, y0 = cy - ((n) * 21) / 2 + 2;
  el('text', { x: cx, y: y0, 'text-anchor': 'middle', 'font-size': 18.5, 'font-weight': 700, fill: INK }, title);
  lines.forEach((s, i) => el('text', { x: cx, y: y0 + 24 + i * 21, 'text-anchor': 'middle', 'font-size': 15.5, fill: '#2f2f2b' }, s));
  return { cx, cy, l: cx - w / 2, r: cx + w / 2, t: cy - h / 2, b: cy + h / 2 };
}
function arrow(pts, n, at, label, dashed = false) {
  el('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: '#3a3a36', 'stroke-width': 2.2, 'marker-end': 'url(#ar)', ...(dashed ? { 'stroke-dasharray': '7 5' } : {}) });
  if (n) { el('circle', { cx: at[0], cy: at[1], r: 13, fill: '#1F3864' }); el('text', { x: at[0], y: at[1] + 5, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#fff' }, n); }
  if (label) { const [t, x, y] = label; const w = t.length * 7.8 + 10; el('rect', { x: x - w / 2, y: y - 13, width: w, height: 19, fill: '#fff', opacity: 0.92 }); el('text', { x, y: y + 2, 'text-anchor': 'middle', 'font-size': 14, 'font-style': 'italic', fill: INK }, t); }
}
function colHead(cx, l1, l2, r) { el('text', { x: cx, y: 98, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: R[r][1] }, l1); el('text', { x: cx, y: 118, 'text-anchor': 'middle', 'font-size': 15, fill: R[r][1] }, l2); }
// Azure boundary and layer headings
el('rect', { x: 230, y: 40, width: 950, height: 670, rx: 16, fill: '#f6f8fc', stroke: '#1F3864', 'stroke-width': 2.6 });
el('text', { x: 250, y: 66, 'font-size': 19, 'font-weight': 700, fill: '#1F3864' }, 'Local server · Docker Compose · one command: docker compose up (Azure stand-ins)');
el('text', { x: 110, y: 98, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: R[1][1] }, 'Edge');
el('text', { x: 110, y: 118, 'text-anchor': 'middle', 'font-size': 15, fill: R[1][1] }, 'Role 1 · Ying');
colHead(335, 'Ingestion', 'Role 2 · Marcelbriaud', 2);
colHead(560, 'Business logic', 'Role 3 · Shi', 3);
colHead(820, 'Data', 'Role 4 · Durmusali', 4);
colHead(1065, 'Presentation', 'Role 5 · Idowu', 5);
// services
const SIM = card(110, 300, 170, 150, 'Truck Simulator', ['Python 3.12 container', '6 trucks, 6 processes', '1 message / 10 s', 'fault API :8090'], 1);
const HUB = card(335, 300, 175, 170, 'Mosquitto + Router', ['for Azure IoT Hub', 'mutual TLS · CA + CRL', 'ACL: own topic only', 'router: retries,', 'dead-letter, archive'], 2);
const AF = card(560, 195, 230, 110, 'Alert Function', ['Azure Functions host', 'HTTP trigger locally'], 3);
const LA = card(560, 360, 230, 100, 'Mail relay → Mailpit', ['for the Logic App', 'inbox on :8025'], 3);
const FW = card(560, 520, 230, 100, 'Fleet Watcher Function', ['timer trigger (Azurite)', 'every minute'], 3);
const CDB = card(820, 240, 225, 160, 'Cosmos DB emulator', ['same SDK and queries', 'telemetry · alerts ·', 'reference containers', 'Data Explorer :1234'], 4);
const BLOB = card(820, 480, 225, 130, 'Azurite (Blob)', ['raw archive, JSON lines', 'batches every 5 minutes', 'dead-letter folder'], 4);
const API = card(1065, 240, 190, 120, 'Fleet API Function', ['6 HTTP routes', ':7071/api'], 5);
const SWA = card(1065, 450, 190, 130, 'Dashboard (nginx)', ['for Static Web Apps', 'React + Leaflet', ':5173, polls 5 s'], 5);
const OPS = card(705, 662, 920, 60, 'Operations: container logs · health & cost panel (F11) · same code runs on Azure with infra/terraform', [], 'ops');
// outside Azure
const MAIL = card(1295, 330, 180, 90, 'Staff inbox', ['Mailpit web page'], 'x', true);
const USERS = card(1295, 455, 180, 110, 'Users', ['dispatcher · QA officer', 'fleet manager', '(web browser)'], 'x', true);
const OSM = card(1295, 590, 180, 90, 'OpenStreetMap', ['map tiles'], 'x', true);
const GH = card(470, 800, 420, 90, 'GitHub + GitHub Actions', ['5 test jobs + full end-to-end run on every push'], 'x', true);
const TF = card(950, 800, 420, 90, 'Terraform (azurerm) – Part 4', ['validated now, applied on Azure in Part 4'], 'x', true);
// numbered flow
arrow([[SIM.r, 300], [HUB.l, 300]], '1', [212, 284]);
arrow([[HUB.cx, HUB.t], [HUB.cx, 195], [AF.l, 195]], '2', [392, 195]);
arrow([[HUB.cx, HUB.b], [HUB.cx, 600], [820, 600], [820, BLOB.b]], '3', [600, 600]);
arrow([[AF.r, 195], [CDB.l, 205]], '4', [690, 188]);
arrow([[AF.cx, AF.b], [AF.cx, LA.t]], '5', [583, 280]);
arrow([[LA.r, 345], [1190, 345], [1190, 330], [MAIL.l, 330]], null, null, ['email / SMS', 1132, 333]);
arrow([[FW.cx, FW.t], [FW.cx, LA.b]], '6', [583, 440]);
arrow([[FW.r, 505], [700, 505], [CDB.l - 10, 310], [CDB.l, 310]], null, null);
arrow([[API.l, 240], [CDB.r, 240]], '7', [950, 222]);
arrow([[SWA.cx, SWA.t], [SWA.cx, API.b]], '8', [1042, 367]);
arrow([[USERS.l, 455], [SWA.r, 455]], null, null);
arrow([[OSM.l, 590], [1140, 590], [1140, SWA.b]], null, null, ['tiles', 1172, 572]);
arrow([[GH.cx, GH.t], [GH.cx, 712]], '9', [493, 735]);
arrow([[TF.cx, TF.t], [TF.cx, 712]], null, null);
// legend
const steps = [
  '1  Each truck publishes a 0.3 KB JSON message every 10 s with its own certificate.',
  '2  Mosquitto accepts only signed, non-revoked trucks; the router forwards each message …',
  '3  … and to Blob Storage, which keeps the raw archive for audits.',
  '4  The Alert Function saves the reading and any alert in Cosmos DB.',
  '5  A new alert calls the mail relay, which emails the Mailpit inbox (0.1 s measured).',
  '6  Every minute the Fleet Watcher finds offline or late trucks and raises those alerts.',
  '7  The Fleet API reads the latest data and alert history from Cosmos DB.',
  '8  The dashboard polls the API every 5 seconds and draws the map; users acknowledge alerts.',
  '9  GitHub Actions runs every test suite and the end-to-end run on each push.',
];
el('rect', { x: 10, y: 860, width: 1380, height: 194, rx: 10, fill: '#fff', stroke: '#A6A6A6' });
el('text', { x: 24, y: 886, 'font-size': 18, 'font-weight': 700, fill: INK }, 'Follow the numbers (colour = owner role; dashed boxes are outside the local stack)');
steps.forEach((s, i) => el('text', { x: 24 + (i >= 5 ? 690 : 0), y: 914 + (i % 5) * 27, 'font-size': 15.5, fill: '#2f2f2b' }, s));
window.READY = true;
</script></body></html>
